name: Quality gates
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip:
        description: Comma-separated qa:phase checks to skip
        type: string
        default: live-regions
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    # The downloaded pinned Chromium requires working sandboxed user namespaces.
    # Keep OS policy intact; Ubuntu24 blocks it and its installed Chrome is writable.
    # Reassess this supported runner before the published Ubuntu22 retirement.
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - name: Documentation links and skills
        run: node scripts/docs-check.mjs
      - name: Configure isolated local services
        run: |
          cp .env.example .env
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { randomBytes } from 'node:crypto';
          writeFileSync('.env', readFileSync('.env', 'utf8')
            .replace(/^NEXTAUTH_SECRET=.*$/m, `NEXTAUTH_SECRET=${randomBytes(48).toString('hex')}`)
            // Fixture-only Discord pair so the provider registers; tests never reach Discord.
            .replace(/^DISCORD_CLIENT_ID=.*$/m, 'DISCORD_CLIENT_ID=100000000000000000')
            .replace(/^DISCORD_CLIENT_SECRET=.*$/m, `DISCORD_CLIENT_SECRET=${randomBytes(24).toString('hex')}`));
          JS
          docker compose up -d --wait
          npm run db:deploy
          npm run data:sync
      - run: npx playwright install --with-deps chromium
      - name: Verify the pinned browser sandbox
        run: node scripts/qa-browser-sandbox.mjs
      - name: Source credential patterns
        run: node scripts/qa-source-secrets.mjs
      - name: Types, lint, units, migrations, build, browsers, advisories and regional smoke
        run: npm run qa:phase
        env:
          # The live AODP check spends real upstream budget and depends on a third party;
          # it runs from the manual "Live data check" workflow instead.
          QA_SKIP: ${{ inputs.skip || 'live-regions' }}
      - name: Browser bundle configured-secret scan
        run: node scripts/qa-secret-scan.mjs
      - name: Prepare sanitized failure evidence
        if: always()
        run: node scripts/qa-ci-evidence.mjs
      - name: Remove ephemeral CI services
        if: always()
        run: docker compose down --volumes
