name: Quality gates
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - name: Verify rebuild documentation and source inventory
        run: node scripts/rebuild-inventory.mjs --check
      - name: Configure isolated local services
        run: |
          cp .env.example .env
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { randomBytes } from 'node:crypto';
          writeFileSync('.env', readFileSync('.env', 'utf8').replace(/^NEXTAUTH_SECRET=.*$/m, `NEXTAUTH_SECRET=${randomBytes(48).toString('hex')}`));
          JS
          docker compose up -d --wait
          npm run db:deploy
          npm run data:sync
      - run: npx playwright install --with-deps chromium
      - name: Source credential patterns
        run: node scripts/qa-source-secrets.mjs
      - name: Types, lint, units, migrations, build, browsers, advisories and regional smoke
        run: npm run qa:phase
      - name: Browser bundle configured-secret scan
        run: node scripts/qa-secret-scan.mjs
      - name: Remove ephemeral CI services
        if: always()
        run: docker compose down --volumes
