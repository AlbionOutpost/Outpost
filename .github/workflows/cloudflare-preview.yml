name: Cloudflare deployment
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", ".github/workflows/documentation.yml"]
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify:
    # Exercises the exact Cloudflare build under local workerd with the core flows before
    # anything is deployed (the pull request already ran the static checks and the core flows
    # on the Node build). The deploy job rebuilds the same deterministic bundle.
    if: github.repository == 'AlbionOutpost/Outpost' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # The downloaded pinned Chromium requires working sandboxed user namespaces.
    # Keep OS policy intact; Ubuntu24 blocks it and its installed Chrome is writable.
    # Reassess this supported runner before the published Ubuntu22 retirement.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
      XDG_CONFIG_HOME: ${{ github.workspace }}/.qa/wrangler-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Configure disposable local fixture services
        run: node scripts/ci-local-services.mjs
      - name: Generate and verify the SQLite runtime
        run: node scripts/qa-cloudflare-runtime.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify the pinned browser sandbox
        run: node scripts/qa-browser-sandbox.mjs
      - name: Build Cloudflare and exercise the core flows with isolated fixture sessions
        run: |
          node scripts/cloudflare-build.mjs
          npx tsc --project cloudflare/tsconfig.json
          npx tsc --project cloudflare/web/tsconfig.json
          E2E_CLOUDFLARE=1 E2E_PRODUCTION=1 npm run test:e2e:core -- --reporter=line,github
      - name: Prepare sanitized failure evidence
        if: always()
        run: node scripts/qa-ci-evidence.mjs
      - name: Remove ephemeral CI services
        if: always()
        run: docker compose down --volumes
  deploy:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: cloudflare-production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
      XDG_CONFIG_HOME: ${{ github.workspace }}/.qa/wrangler-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Configure disposable local fixture services
        run: node scripts/ci-local-services.mjs
      - name: Generate and verify the SQLite runtime
        run: node scripts/qa-cloudflare-runtime.mjs
      - name: Prepare the production challenge and reviewed bindings
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          CLOUDFLARE_CATALOG_DATABASE_ID: ${{ vars.CLOUDFLARE_CATALOG_DATABASE_ID }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_SLOT_HUB: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_HUB }}
          NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE }}
        run: |
          node scripts/cloudflare-build.mjs
          node scripts/cloudflare-release-config.mjs
          node scripts/qa-source-secrets.mjs
          node scripts/qa-secret-scan.mjs
      - name: Verify Free bundle limits and deploy binding-only backend and website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-deploy.mjs
      - name: Check public HTTPS and report edge challenges separately
        env:
          OUTPOST_CI_REPORT_EDGE_CHALLENGE: "1"
        run: node scripts/cloudflare-deployment-check.mjs
      - name: Remove ephemeral CI services
        if: always()
        run: docker compose down --volumes
