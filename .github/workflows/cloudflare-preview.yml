name: Cloudflare deployment
on:
  push:
    branches: [main, codex/cloudflare-free-launch]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  quality:
    if: github.repository == 'AlbionOutpost/Outpost' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/cloudflare-free-launch' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/quality.yml
  deploy:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: cloudflare-production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
      XDG_CONFIG_HOME: ${{ github.workspace }}/.qa/wrangler-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Configure disposable local fixture services
        run: |
          cp .env.example .env
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { randomBytes } from 'node:crypto';
          writeFileSync('.env', readFileSync('.env', 'utf8').replace(/^NEXTAUTH_SECRET=.*$/m, `NEXTAUTH_SECRET=${randomBytes(48).toString('hex')}`));
          JS
          docker compose up -d --wait
          npm run db:deploy
          npm run data:sync
      - name: Generate and verify the SQLite runtime
        run: |
          node scripts/cloudflare-database-generate.mjs
          node scripts/cloudflare-domain-constraints.mjs --check
          npx tsc --project cloudflare/tsconfig.json
          python3 scripts/qa-d1-schema.py
          node scripts/cloudflare-stage-catalog.mjs --write-local
          node scripts/cloudflare-stage-library.mjs --write-local
          npx wrangler d1 execute CATALOG --local --config cloudflare/database/wrangler.jsonc --file "$GITHUB_WORKSPACE/.qa/cloudflare-catalog/local-import.sql" --persist-to "$GITHUB_WORKSPACE/.qa/cloudflare-database-test/state"
          npx wrangler d1 execute CATALOG --local --config cloudflare/database/wrangler.jsonc --file "$GITHUB_WORKSPACE/.qa/cloudflare-library/local-import.sql" --persist-to "$GITHUB_WORKSPACE/.qa/cloudflare-database-test/state"
          node scripts/qa-cloudflare-database.mjs
      - run: npx playwright install --with-deps chromium
      - name: Build and exercise Cloudflare with isolated fixture sessions
        run: |
          node scripts/cloudflare-build.mjs
          npx tsc --project cloudflare/web/tsconfig.json
          E2E_CLOUDFLARE=1 E2E_PRODUCTION=1 npx playwright test
          node scripts/qa-source-secrets.mjs
          node scripts/qa-secret-scan.mjs
      - name: Prepare the production challenge and reviewed bindings
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          CLOUDFLARE_CATALOG_DATABASE_ID: ${{ vars.CLOUDFLARE_CATALOG_DATABASE_ID }}
        run: |
          node scripts/cloudflare-build.mjs
          node scripts/cloudflare-release-config.mjs
      - name: Verify Free bundle limits and deploy binding-only backend and website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/cloudflare-free-check.mjs
          npx wrangler deploy --config .qa/cloudflare-release/data.jsonc
          npx wrangler deploy --config .qa/cloudflare-release/web.jsonc
      - name: Check public HTTPS and report edge challenges separately
        env:
          OUTPOST_CI_REPORT_EDGE_CHALLENGE: "1"
        run: node scripts/cloudflare-deployment-check.mjs
      - name: Remove ephemeral CI services
        if: always()
        run: docker compose down --volumes
