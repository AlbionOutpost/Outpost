name: Library data
# Carries the archive's like counts and the listed build total into the staged D1 library
# (scripts/cloudflare-library-upvotes.mjs). Manual only; idempotent; writes production data,
# so it runs in the protected production environment.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  likes:
    if: github.repository == 'AlbionOutpost/Outpost' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: cloudflare-production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Carry like counts into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_CATALOG_DATABASE_ID: ${{ vars.CLOUDFLARE_CATALOG_DATABASE_ID }}
        run: node scripts/cloudflare-library-upvotes.mjs --apply
