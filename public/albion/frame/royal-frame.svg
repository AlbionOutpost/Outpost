<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1d79a"/>
      <stop offset=".45" stop-color="#b8894a"/>
      <stop offset="1" stop-color="#6b4a25"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3026"/>
      <stop offset="1" stop-color="#1c1712"/>
    </linearGradient>
    <radialGradient id="gem" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffb08a"/>
      <stop offset=".45" stop-color="#d4502a"/>
      <stop offset="1" stop-color="#5e1a0c"/>
    </radialGradient>
  </defs>
  <!-- band: dark metal with a gold inlay line -->
  <path fill="url(#b)" fill-rule="evenodd" d="M0 0h120v120H0z M10 10v100h100V10z"/>
  <path fill="none" stroke="url(#g)" stroke-width="1.6" d="M4.5 4.5h111v111h-111z"/>
  <path fill="none" stroke="#c99a52" stroke-opacity=".55" stroke-width="1" d="M9.5 9.5h101v101h-101z"/>
  <!-- stepped corner plates -->
  <g fill="url(#g)" stroke="#2a1f14" stroke-width=".8">
    <path d="M0 0h26l-6 6h-8v8l-6 6V0z"/>
    <path d="M120 0H94l6 6h8v8l6 6V0z"/>
    <path d="M0 120h26l-6-6h-8v-8l-6-6v20z"/>
    <path d="M120 120H94l6-6h8v-8l6-6v20z"/>
  </g>
  <!-- set stones -->
  <g fill="url(#gem)" stroke="#f1d79a" stroke-width=".9">
    <path d="M9 4l5 5-5 5-5-5z"/>
    <path d="M111 4l5 5-5 5-5-5z"/>
    <path d="M9 106l5 5-5 5-5-5z"/>
    <path d="M111 106l5 5-5 5-5-5z"/>
  </g>
  <!-- studs mid-edge -->
  <g fill="url(#g)" stroke="#2a1f14" stroke-width=".6">
    <circle cx="60" cy="5" r="2.2"/>
    <circle cx="60" cy="115" r="2.2"/>
    <circle cx="5" cy="60" r="2.2"/>
    <circle cx="115" cy="60" r="2.2"/>
  </g>
</svg>
